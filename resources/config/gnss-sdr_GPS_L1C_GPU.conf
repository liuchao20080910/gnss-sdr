[GNSS-SDR]
GNSS-SDR.internal_fs_sps=26000000
GNSS-SDR.tow_to_trk=true              ; 允许遥测解码器把 TOW 回传给跟踪块（已在跟踪块实现）

SignalSource.implementation=File_Signal_Source
SignalSource.filename=/home/nvidia/Workspace/GNSS/gnss-sdr/GPS_L1C_samp26M_if4.092M_60S.bin
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=26000000
SignalSource.samples=0
SignalSource.repeat=false

SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Ibyte_To_Complex

InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.85
InputFilter.band2_begin=0.90
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=26000000
InputFilter.IF=-4092000               ; 注意负号，与生成器一致
InputFilter.decimation_factor=1

Resampler.implementation=Pass_Through

Channels_1C.count=20                  ; 增加通道数
Channels.in_acquisition=1

Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.threshold=0.005        ; 捕获门限。实测收紧到 0.008 反而增加重捕次数
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250

Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking_GPU
Tracking_1C.pll_bw_hz=30.0            ; PLL 带宽(Hz)。实测本数据 30 比 20/25 失锁更少
Tracking_1C.dll_bw_hz=2.0             ; 加宽DLL带宽
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.cn0_min=25               ; CN0 下限(dB-Hz)。实测 30 会让失锁次数翻倍，25 最稳
Tracking_1C.cn0_samples=20            ; CN0/载波锁定量估计窗长（默认 20）
Tracking_1C.max_carrier_lock_fail=5000 ; 载波锁连续失败上限（默认 5000）
Tracking_1C.cn0_smoother_alpha=0.002  ; CN0 指数平滑系数（与 CPU 版一致）
Tracking_1C.carrier_lock_test_smoother_alpha=0.002 ; 载波锁定量平滑系数（与 CPU 版一致）
Tracking_1C.pull_in_time_s=3          ; 牵引过渡期(s)，期内不判失锁
Tracking_1C.bit_synchronization_time_limit_s=20 ; 比特同步超时(s)，超时强制重捕
Tracking_1C.dump=false               ; 不需要逐通道跟踪原始数据时关掉（每通道每 ms 都在写，很占空间）
Tracking_1C.dump_filename=/home/nvidia/Workspace/GNSS/gnss-sdr/logs/gpu/trk_dump.dat

TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=/home/nvidia/Workspace/GNSS/gnss-sdr/logs/gpu/obs_dump
PVT.implementation=RTKLIB_PVT
PVT.raim_fde=1                        ; 残差检验并剔除故障星（RAIM FDE）
PVT.threshold_reject_gdop=6.0         ; GDOP 超过 6 的观测量按野值剔除（默认 30，太松）
PVT.threshold_reject_innovation=15.0  ; 新息超过 15 m 按野值剔除（默认 30）
PVT.output_rate_ms=100
PVT.display_rate_ms=1000
PVT.dump=true
PVT.dump_filename=/home/nvidia/Workspace/GNSS/gnss-sdr/logs/gpu/pvt_dump